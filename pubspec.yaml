name: emotions_and_care_v1
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  cached_network_image: ^3.4.1
  card_swiper: ^3.0.1
  cupertino_icons: ^1.0.6
  equatable: ^2.0.5
  firebase_core: ^3.6.0
  firebase_messaging: ^15.2.0
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.0.10+1
  get_it: ^7.7.0
  http: ^1.2.2
  lottie: ^3.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - lib/config/assets/images/
    - lib/config/assets/animations/

  # Configuración de las fuentes
  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
        - asset: assets/fonts/Gilroy-Light.ttf
        - asset: assets/fonts/Gilroy-Medium.ttf
        - asset: assets/fonts/Gilroy-Regular.ttf
